name: Tests und Deployment

# Läuft bei jedem Push auf main (und bei Pull Requests nur als Test).
# workflow_call: Der Daten-Job (Phase 3) ruft diesen Workflow nach einem erfolgreichen Daten-Update auf.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git-Stand, der gebaut wird (der Daten-Job übergibt main nach dem Daten-Commit)'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests (Handy 360 px und Desktop)
        run: npm run test:e2e
      - name: Testbericht sichern, falls etwas fehlschlägt
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-ergebnisse
          path: test-results/
          retention-days: 7

  build:
    name: Bauen
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App für GitHub Pages bauen
        run: |
          VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
