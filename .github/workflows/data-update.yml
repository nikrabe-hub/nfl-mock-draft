name: Daten-Update

# Holt Draft-Reihenfolge, Big Board und College-Statistiken (nur dieser Job ruft fremde Seiten ab, nie die App).
# Die Statistiken stehen auf der Big-Board-Seite und werden mit ihr zusammen gespeichert.
#
# Zeiten (Berliner Zeit): Tankathon Full Draft Di 08:00 · Tankathon Big Board Di 08:20.
# GitHub rechnet Cron in UTC. Damit es im Sommer und im Winter stimmt, startet jede Quelle zu beiden möglichen
# UTC-Zeiten; das Skript lässt nur den Start durch, der zur Berliner Zeit passt (und nur einmal pro Tag).
on:
  schedule:
    - cron: '0 6 * * 2'   # Full Draft, Sommerzeit
    - cron: '0 7 * * 2'   # Full Draft, Winterzeit
    - cron: '20 6 * * 2'  # Big Board, Sommerzeit
    - cron: '20 7 * * 2'  # Big Board, Winterzeit
  workflow_dispatch:
    inputs:
      source:
        description: 'Welche Quelle jetzt abrufen? (höchstens 1× pro Tag und Quelle)'
        type: choice
        required: true
        options:
          - tankathon-order
          - tankathon-board

# Immer nur ein Daten-Lauf gleichzeitig (verhindert Konflikte beim Speichern und zu viele Anfragen).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: Daten abrufen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - id: which
        name: Quelle bestimmen
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "source=$INPUT_SOURCE" >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "0 6 * * 2"|"0 7 * * 2")   S=tankathon-order ;;
              "20 6 * * 2"|"20 7 * * 2") S=tankathon-board ;;
              *) echo "Unbekannter Zeitplan: $SCHEDULE"; exit 1 ;;
            esac
            echo "source=$S" >> "$GITHUB_OUTPUT"
            echo "trigger=schedule" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: run
        name: Abrufen, prüfen, speichern
        run: npx tsx scripts/data-update/run.ts --source=${{ steps.which.outputs.source }} --trigger=${{ steps.which.outputs.trigger }}

      # Auch bei einem Fehler wird der Zustand (z.B. "heute schon versucht") gespeichert,
      # damit ein zweiter Start nicht sofort wieder bei der Quelle anfragt.
      - name: Änderungen speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data-state
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
            exit 0
          fi
          git commit -m "Daten-Update: ${{ steps.which.outputs.source }}"
          git pull --rebase origin main
          git push origin HEAD:main

  # Ein Push mit dem Standard-Token startet keinen weiteren Workflow, deshalb wird die Veröffentlichung hier ausdrücklich aufgerufen.
  deploy:
    name: Neue Daten veröffentlichen
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ci-deploy.yml
    with:
      ref: main
