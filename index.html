<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a5b" />
    <meta name="description" content="NFL Mock Draft Simulator für den Draft 2027 – funktioniert offline." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>NFL Mock Draft Simulator 2027</title>
    <script>
      // Theme/Sprache vor dem ersten Zeichnen setzen (verhindert Aufblitzen)
      try {
        var t = localStorage.getItem('nmd-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('nmd-lang');
        if (l === 'de' || l === 'en') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Diese App braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
